version: '3.8'

services:
  aniyamusic:
    build: .
    container_name: aniyamusic_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: aniyamusic_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
